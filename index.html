<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>COS 102 / Python Programming — Revision Quiz</title>
<style>
:root{
  --teal:#0f766e; --teal-dark:#0b5a54; --teal-soft:#e6f3f1;
  --gold:#bfa04a; --ink:#2b2f33; --grey:#6b7075; --line:#e3e6e8; --white:#ffffff;
  --green:#1a7a4c;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  background:#f7f8f7; color:var(--ink); line-height:1.5; -webkit-tap-highlight-color:transparent;
}
header{
  background:var(--white); border-bottom:1px solid var(--line); padding:22px 18px 18px;
  position:sticky; top:0; z-index:10;
}
.dept{ font-size:13px; letter-spacing:2px; text-transform:uppercase; color:var(--gold); font-weight:600; }
h1{ font-size:22px; margin:4px 0 2px; color:var(--teal-dark); font-weight:700; }
.sub{ font-size:13px; color:var(--grey); margin-bottom:14px; }
.meta{ font-size:12px; color:var(--grey); margin-bottom:12px; }
.search-wrap{ position:relative; }
#search{
  width:100%; padding:11px 14px 11px 38px; border-radius:10px; border:1px solid var(--line);
  font-size:15px; background:#fafbfa; color:var(--ink); outline:none;
}
#search:focus{ border-color:var(--teal); box-shadow:0 0 0 3px var(--teal-soft); }
.search-icon{ position:absolute; left:12px; top:50%; transform:translateY(-50%); color:var(--grey); font-size:15px; }

main{ max-width:720px; margin:0 auto; padding:16px 14px 60px; }

.part-label{
  font-size:12px; letter-spacing:1.5px; text-transform:uppercase; color:var(--teal);
  font-weight:700; margin:22px 4px 8px; opacity:0.9;
}
.part-label:first-child{ margin-top:4px; }

.card{
  background:var(--white); border:1px solid var(--line); border-left:4px solid var(--teal);
  border-radius:10px; padding:16px 16px 14px; margin-bottom:14px;
  box-shadow:0 1px 2px rgba(20,30,30,0.04);
  transition:box-shadow .2s ease;
}
.card.hidden{ display:none; }
.q-row{ display:flex; gap:10px; align-items:flex-start; }
.q-num{
  flex-shrink:0; width:26px; height:26px; border-radius:50%; background:var(--teal); color:#fff;
  font-size:12px; font-weight:700; display:flex; align-items:center; justify-content:center; margin-top:1px;
}
.q-text{ font-size:15.5px; font-weight:600; color:var(--ink); }

.options{ margin:12px 0 4px 36px; }
.opt{
  display:flex; gap:8px; align-items:baseline; font-size:14.5px; color:#3d4147; padding:9px 10px;
  border-radius:8px; border:1px solid var(--line); margin-bottom:6px; cursor:pointer;
  transition:background .15s ease, border-color .15s ease, transform .1s ease;
}
.opt:active{ transform:scale(0.98); }
.opt .letter{ font-weight:700; color:var(--gold); width:18px; flex-shrink:0; }
.card.answered .opt{ cursor:default; }
.card.answered .opt:active{ transform:none; }
.opt.pick-correct{ background:#e9f7ef; border-color:var(--green); }
.opt.pick-correct .letter{ color:var(--green); }
.opt.pick-wrong{ background:#fdeceb; border-color:#c0392b; }
.opt.pick-wrong .letter{ color:#c0392b; }
.opt.reveal-correct{ background:#e9f7ef; border-color:var(--green); }

.feedback{
  margin:10px 0 0 36px; font-size:13.5px; font-weight:600; min-height:18px;
  max-height:0; overflow:hidden; opacity:0; transition:max-height .3s ease, opacity .3s ease, margin-top .3s ease;
}
.feedback.show{ max-height:40px; opacity:1; }
.feedback.correct{ color:var(--green); }
.feedback.wrong{ color:#c0392b; }

.no-results{ text-align:center; color:var(--grey); font-size:14px; padding:40px 10px; display:none; }

footer{
  text-align:center; font-size:11px; letter-spacing:1.5px; color:var(--grey); padding:20px 10px 30px;
}

@media (max-width:480px){
  h1{ font-size:19px; }
  .q-text{ font-size:14.5px; }
  main{ padding:12px 10px 50px; }
}
</style>
</head>

const main = document.getElementById("quiz-main");
const searchInput = document.getElementById("search");
const noResults = document.getElementById("no-results");

function render(){
  main.innerHTML = "";
  let lastPart = null;
  let visibleCount = 0;

  QUIZ.forEach(q => {
    if (q.part !== lastPart){
      const label = document.createElement("div");
      label.className = "part-label";
      label.textContent = q.part;
      label.dataset.part = "1";
      main.appendChild(label);
      lastPart = q.part;
    }

    const card = document.createElement("div");
    card.className = "card";
    card.dataset.search = (q.text + " " + q.options.map(o=>o.text).join(" ")).toLowerCase();

    const optsHtml = q.options.map(o =>
      `<div class="opt" data-letter="${o.letter}"><span class="letter">${o.letter}.</span><span>${escapeHtml(o.text)}</span></div>`
    ).join("");

    card.innerHTML = `
      <div class="q-row">
        <div class="q-num">${q.n}</div>
        <div class="q-text">${escapeHtml(q.text)}</div>
      </div>
      <div class="options">${optsHtml}</div>
      <div class="feedback"></div>
    `;

    const feedback = card.querySelector(".feedback");
    card.querySelectorAll(".opt").forEach(optEl => {
      optEl.addEventListener("click", () => {
        if (card.classList.contains("answered")) return;
        card.classList.add("answered");
        const picked = optEl.dataset.letter;
        const isCorrect = picked === q.answer;

        optEl.classList.add(isCorrect ? "pick-correct" : "pick-wrong");
        if (!isCorrect){
          const correctEl = card.querySelector(`.opt[data-letter="${q.answer}"]`);
          if (correctEl) correctEl.classList.add("reveal-correct");
        }

        feedback.textContent = isCorrect ? "Correct!" : `Incorrect — correct answer is ${q.answer}.`;
        feedback.classList.add("show", isCorrect ? "correct" : "wrong");
      });
    });

    main.appendChild(card);
    visibleCount++;
  });

  applyFilter();
}

function escapeHtml(s){
  const div = document.createElement("div");
  div.textContent = s;
  return div.innerHTML;
}

function applyFilter(){
  const term = searchInput.value.trim().toLowerCase();
  const cards = main.querySelectorAll(".card");
  const labels = main.querySelectorAll(".part-label");
  let anyVisible = false;

  cards.forEach(card => {
    const match = !term || card.dataset.search.includes(term);
    card.classList.toggle("hidden", !match);
    if (match) anyVisible = true;
  });

  // Hide a part label if none of the cards following it (until the next
  // label) are visible.
  labels.forEach(label => {
    let el = label.nextElementSibling;
    let show = false;
    while (el && !el.classList.contains("part-label")){
      if (el.classList.contains("card") && !el.classList.contains("hidden")){ show = true; break; }
      el = el.nextElementSibling;
    }
    label.style.display = show ? "" : "none";
  });

  noResults.style.display = anyVisible ? "none" : "block";
}

searchInput.addEventListener("input", applyFilter);
render();
</script>
